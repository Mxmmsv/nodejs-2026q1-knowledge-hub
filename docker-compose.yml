name: mxmmsv-knowledge-hub

services:
  app:
    image: mxmmsv-knowledge-hub-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-knowledge_hub}?schema=public&connection_limit=5
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4000}/doc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - mxmmsv-knowledge-hub-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
    ports:
      - "5432:5432"
    volumes:
      - mxmmsv-knowledge-hub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-knowledge_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mxmmsv-knowledge-hub-network

  adminer:
    image: adminer
    profiles:
      - debug
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - mxmmsv-knowledge-hub-network

networks:
  mxmmsv-knowledge-hub-network:
    name: mxmmsv-knowledge-hub-network
    driver: bridge

volumes:
  mxmmsv-knowledge-hub-postgres-data:
    name: mxmmsv-knowledge-hub-postgres-data
